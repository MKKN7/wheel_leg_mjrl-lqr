schema_version: 1
backend: mujoco_warp
run_mode: sim_training
xml_path: ../wheeled_infantry.xml
num_worlds: 128
physics_substeps_per_action: 10
smoke_actions: 2

runtime:
  device: cuda:0
  # Keep DR's set_const/NVRTC precompiled-header files isolated from the flat
  # harness. This path is created by Warp before its first CUDA initialization.
  cache_path: ../.cache/warp/runtime
  temporary_path: ../.cache/warp/temp
  cuda_graph: false
  # Warp 1.16 + CUDA 12.9 on this Windows host cannot reliably reuse the
  # driver-owned NVRTC PCH directory. Disabling PCH changes compile latency,
  # never simulation numerics or controller safety.
  use_precompiled_headers: false

data_capacity:
  nconmax: 128
  nccdmax: 128
  njmax: 512
  njmax_nnz: 5120
  naconmax: 4096
  naccdmax: 4096
  nvmax: 44

safety:
  torque_limit_ratio_sim: 1.00
  torque_limit_ratio_real: 0.80
  current_limit_A: 60.0
  estop_on_nonfinite_control: true
  estop_on_nonfinite_state: true
  estop_on_overflow: true

fall_guard:
  enabled: true
  max_attitude_error_rad: 1.00
  max_root_height_drop_m: 0.22

preflight:
  verify_single_step_parity: true
  verify_estop: true
  qpos_max_abs_error: 0.00001
  qvel_max_abs_error: 0.00010
  sensordata_max_abs_error: 0.00100

# Every field is per-world and sampled only at reset. The values mirror the
# conservative CPU terrain_vehicle_only_defaults profile where Warp exposes a
# batchable equivalent. No terrain geom, hfield data, collision mask, mesh, or
# support pose is randomized.
domain_randomization:
  enabled: true
  seed: 17
  ranges:
    body_mass: [-0.04, 0.04]
    body_inertia: [-0.10, 0.10]
    dof_damping: [-0.12, 0.12]
    geom_friction: [-0.10, 0.10]
    actuator_strength: [-0.07, 0.0]
  noise:
    std: 0.0
  delay:
    steps: 0
  terrain_geometry_randomization: false

scope:
  controller_backend: raw_controls_only
  ppo_training_enabled: false
