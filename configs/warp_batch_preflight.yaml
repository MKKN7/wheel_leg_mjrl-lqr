schema_version: 1
backend: mujoco_warp
run_mode: sim_training
# Keep the default installation check on the primitive-only scene verified by
# the current MuJoCo-Warp/CUDA matrix. RMUC hfield courses are invoked through
# their own curriculum manifests after their scene-specific GPU gate passes.
xml_path: ../wheeled_infantry.xml
num_worlds: 128
physics_substeps_per_action: 10
smoke_actions: 2

runtime:
  device: cuda:0
  # A writable, no-space path avoids the system TEMP/cache ACL issue observed
  # during the first NVRTC compilation on this workstation.
  # Warp 1.16 keeps one process-global kernel cache; all course batches share
  # this directory so later stages can initialize in the same process.
  cache_path: ../.cache/warp/runtime
  temporary_path: ../.cache/warp/temp
  cuda_graph: false
  # Warp 1.16 on this Windows CUDA host can create a driver-owned temporary
  # PCH directory with restrictive ACLs. Disabling PCH changes compile time,
  # not physics, controls, or safety semantics.
  use_precompiled_headers: false

data_capacity:
  nconmax: 128
  nccdmax: 128
  njmax: 512
  njmax_nnz: 5120
  # This flat preflight reserves enough aggregate contact storage for the
  # guide-wheel contacts without loading an RMUC height field.
  naconmax: 16384
  naccdmax: 16384
  nvmax: 44

safety:
  torque_limit_ratio_sim: 1.00
  torque_limit_ratio_real: 0.80
  current_limit_A: 60.0
  estop_on_nonfinite_control: true
  estop_on_nonfinite_state: true
  estop_on_overflow: true

fall_guard:
  enabled: true
  max_attitude_error_rad: 1.00
  max_root_height_drop_m: 0.22

preflight:
  verify_single_step_parity: true
  verify_estop: true
  qpos_max_abs_error: 0.00001
  qvel_max_abs_error: 0.00010
  sensordata_max_abs_error: 0.00100

scope:
  controller_backend: raw_controls_only
  ppo_training_enabled: false
