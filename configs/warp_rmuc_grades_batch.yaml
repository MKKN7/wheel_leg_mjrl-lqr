schema_version: 1
backend: mujoco_warp
run_mode: sim_training
xml_path: ../rm_train_ground.xml
num_worlds: 128
physics_substeps_per_action: 10
smoke_actions: 2

runtime:
  device: cuda:0
  cache_path: ../.cache/warp/runtime
  temporary_path: ../.cache/warp/temp
  cuda_graph: false
  use_precompiled_headers: false

data_capacity:
  nconmax: 256
  nccdmax: 256
  njmax: 512
  njmax_nnz: 5120
  # Aggregate contact capacity is shared by all worlds.  With the guide
  # rollers active, transient hfield contacts can exceed 32 contacts/world;
  # 8192 provides 64 contacts/world at the configured 128-world batch.
  naconmax: 16384
  naccdmax: 16384
  nvmax: 44

safety:
  torque_limit_ratio_sim: 1.00
  torque_limit_ratio_real: 0.80
  current_limit_A: 60.0
  estop_on_nonfinite_control: true
  estop_on_nonfinite_state: true
  estop_on_overflow: true

fall_guard:
  enabled: true
  max_attitude_error_rad: 1.00
  max_root_height_drop_m: 0.22

preflight:
  verify_single_step_parity: true
  verify_estop: true
  qpos_max_abs_error: 0.00001
  qvel_max_abs_error: 0.00010
  sensordata_max_abs_error: 0.00100

# The original plane is a CPU trim aid only. Disable it once, before model
# upload, so every GPU contact, terrain preview, and fall-guard reference is
# derived from the immutable RMUC collision hfield.
static_terrain_support:
  mode: hfield_only
  hfield_geom: rmuc_terrain
  disabled_collision_geoms: [ground]

# Per-world vehicle/sensor uncertainty only. No heightfield samples, terrain
# geometry, collision masks, support pose, or static terrain friction changes.
domain_randomization:
  enabled: true
  seed: 29
  ranges:
    body_mass: [-0.04, 0.04]
    body_inertia: [-0.10, 0.10]
    dof_damping: [-0.12, 0.12]
    geom_friction: [-0.10, 0.10]
    actuator_strength: [-0.07, 0.0]
  noise:
    std: 0.0
  delay:
    steps: 0
  terrain_geometry_randomization: false

scope:
  controller_backend: raw_controls_only
  ppo_training_enabled: false
