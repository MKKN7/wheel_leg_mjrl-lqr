ppo:
  total_timesteps: 65536
  rollout_steps: 32
  epochs: 4
  minibatch_size: 1024
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.20
  value_coefficient: 0.50
  entropy_coefficient: 0.001
  max_gradient_norm: 0.50
  hidden_size: 256
  initial_action_std: 0.12
  seed: 7

output:
  checkpoint_path: ../artifacts/warp_curriculum_ppo_v2.pt
  metrics_path: ../artifacts/warp_curriculum_ppo_v2.metrics.csv
  checkpoint_interval_updates: 1

smoke:
  rollout_steps: 4
  epochs: 1
  minibatch_size: 512
  checkpoint_path: ../artifacts/warp_curriculum_ppo_v2_smoke.pt
  metrics_path: ../artifacts/warp_curriculum_ppo_v2_smoke.metrics.csv

capabilities:
  require_gpu_parity: true
  allow_external_task_factory: true
