schema_version: 1
mode: rolling_passive_guide_wheels
source_xml: ../wheeled_infantry.xml
root_body: robot

# Only the lower 30 x 9 mm CAD guide rollers participate in the training
# model. The four separate 40 mm end rollers are intentionally excluded.
geometry:
  radius_m: 0.015
  half_width_m: 0.0045
  axle_axis: [1.0, 0.0, 0.0]
  cylinder_quat: [0.70710678, 0.0, 0.70710678, 0.0]
  density_kg_m3: 2588.0
  joint_damping_nms: 0.00015
  joint_armature_kg_m2: 0.0
  friction: [1.10, 0.005, 0.0001]
  condim: 3
  contype: 1
  conaffinity: 2
  rgba: [0.07, 0.07, 0.08, 1.0]

# The original root inertial includes the CAD lower-guide mass. The MJCF
# synchronizer removes the following 24 roller mass/inertia contributions
# before assigning each roller its own passive rolling body.
mass_accounting:
  mode: reallocate_from_root_inertial
  baseline_root_inertial:
    mass_kg: 16.62220419
    com_m: [-0.00509948, 0.12135430, -0.00542460]
    fullinertia_kg_m2: [0.40366446, 0.60660496, 0.37345494, -0.01685508, 0.00427268, -0.05125392]

# Root-local centers reproduced from the actual 24 lower 30-6-9 CAD STL
