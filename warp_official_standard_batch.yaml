schema_version: 1
backend: mujoco_warp
xml_path: ../official_standard_warp_ground.xml
num_worlds: 128
physics_substeps_per_action: 10
smoke_actions: 2

runtime:
  device: cuda:0
  cache_path: C:/Users/ASUS/Desktop/try2/warp_curriculum_runtime_cache
  temporary_path: C:/Users/ASUS/Desktop/try2/warp_curriculum_runtime_temp
  cuda_graph: false
  use_precompiled_headers: false

data_capacity:
  nconmax: 128
  nccdmax: 128
  njmax: 256
  njmax_nnz: 5120
  naconmax: 4096
  naccdmax: 4096
  nvmax: 44

safety:
  torque_fraction_of_rated: 0.80
  estop_on_nonfinite_control: true
  estop_on_nonfinite_state: true
  estop_on_overflow: true

fall_guard:
  enabled: true
  max_attitude_error_rad: 1.00
  max_root_height_drop_m: 0.22

preflight:
  verify_single_step_parity: true
  verify_estop: true
  qpos_max_abs_error: 0.00001
  qvel_max_abs_error: 0.00010
  sensordata_max_abs_error: 0.00100

# Per-world vehicle/sensor perturbations only.  Static official field
# geometry, collision masks, and support poses stay immutable after the
# generated GPU scene has passed validate_official_warp_scene().
domain_randomization:
  enabled: true
  seed: 23
  ranges:
    body_mass: [-0.04, 0.04]
    body_inertia: [-0.10, 0.10]
    dof_damping: [-0.12, 0.12]
    geom_friction: [-0.10, 0.10]
    actuator_strength: [-0.07, 0.0]
  noise:
    std: 0.0
  delay:
    steps: 0
  terrain_geometry_randomization: false

scope:
  # WarpPhysicsBatch is deliberately a raw physics layer.  The official
  # residual controller is attached by the curriculum task after the strict
  # scene validator succeeds.
  controller_backend: raw_controls_only
  ppo_training_enabled: false
